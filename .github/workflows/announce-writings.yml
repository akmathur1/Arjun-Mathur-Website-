name: Announce new writings

# Every push to main that changes the writings list mails subscribers about the
# entries that are new relative to the pre-push commit. See scripts/announce-writings.mjs.
on:
  push:
    branches: [main]
    paths: [src/writings.json]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs against github.event.before, which may be several commits back.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The script needs @vercel/blob and nodemailer from package.json.
      - run: npm ci --ignore-scripts

      - run: node scripts/announce-writings.mjs
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          BEFORE_SHA: ${{ github.event.before }}
          SITE_URL: https://arjunkmathur.com

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330"
     role="img" aria-label="Grouped horizontal bar chart of 991 authorized attacks by family: Injection, Steganography, Composition, Vault, Credential, and Total. Each row shows the attacks as a light bar, those blocked by shipped code as a hollow bar, and those blocked with hardening as a solid bar. Shipped code blocks 232 of 991; hardening blocks 988.">
  <rect width="640" height="330" fill="#EDECE8"/>
  <g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">
    <text x="14" y="26" font-size="13" font-weight="700" fill="#1a1a1a">991 authorized attacks, two verdicts each</text>

    <!-- Injection: total 612, shipped 120, hardened 612 -->
    <text x="14" y="61" font-size="13" font-weight="700" fill="#1a1a1a" dominant-baseline="central">Injection</text>
    <rect x="144" y="50" width="234.67" height="22" fill="rgba(26,26,26,0.07)"/>
    <rect x="144" y="54" width="234.67" height="14" fill="#1a1a1a"/>
    <rect x="144.5" y="54.5" width="45.01" height="13" fill="#EDECE8" stroke="#1a1a1a" stroke-width="1"/>
    <text x="534" y="53.5" font-size="12" fill="#696969" dominant-baseline="central">shipped</text>
    <text x="628" y="53.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">120</text>
    <text x="534" y="68.5" font-size="12" fill="#696969" dominant-baseline="central">hardened</text>
    <text x="628" y="68.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">612</text>

    <!-- Steganography: total 258, shipped 30, hardened 258 -->
    <text x="14" y="97" font-size="13" font-weight="700" fill="#1a1a1a" dominant-baseline="central">Steganography</text>
    <rect x="144" y="86" width="98.93" height="22" fill="rgba(26,26,26,0.07)"/>
    <rect x="144" y="90" width="98.93" height="14" fill="#1a1a1a"/>
    <rect x="144.5" y="90.5" width="10.5" height="13" fill="#EDECE8" stroke="#1a1a1a" stroke-width="1"/>
    <text x="534" y="89.5" font-size="12" fill="#696969" dominant-baseline="central">shipped</text>
    <text x="628" y="89.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">30</text>
    <text x="534" y="104.5" font-size="12" fill="#696969" dominant-baseline="central">hardened</text>
    <text x="628" y="104.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">258</text>

    <!-- Composition: total 53, shipped 26, hardened 51 -->
    <text x="14" y="133" font-size="13" font-weight="700" fill="#1a1a1a" dominant-baseline="central">Composition</text>
    <rect x="144" y="122" width="20.32" height="22" fill="rgba(26,26,26,0.07)"/>
    <rect x="144" y="126" width="19.56" height="14" fill="#1a1a1a"/>
    <rect x="144.5" y="126.5" width="8.97" height="13" fill="#EDECE8" stroke="#1a1a1a" stroke-width="1"/>
    <text x="534" y="125.5" font-size="12" fill="#696969" dominant-baseline="central">shipped</text>
    <text x="628" y="125.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">26</text>
    <text x="534" y="140.5" font-size="12" fill="#696969" dominant-baseline="central">hardened</text>
    <text x="628" y="140.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">51</text>

    <!-- Vault: total 54, shipped 49, hardened 53 -->
    <text x="14" y="169" font-size="13" font-weight="700" fill="#1a1a1a" dominant-baseline="central">Vault</text>
    <rect x="144" y="158" width="20.71" height="22" fill="rgba(26,26,26,0.07)"/>
    <rect x="144" y="162" width="20.32" height="14" fill="#1a1a1a"/>
    <rect x="144.5" y="162.5" width="17.79" height="13" fill="#EDECE8" stroke="#1a1a1a" stroke-width="1"/>
    <text x="534" y="161.5" font-size="12" fill="#696969" dominant-baseline="central">shipped</text>
    <text x="628" y="161.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">49</text>
    <text x="534" y="176.5" font-size="12" fill="#696969" dominant-baseline="central">hardened</text>
    <text x="628" y="176.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">53</text>

    <!-- Credential: total 14, shipped 7, hardened 14 -->
    <text x="14" y="205" font-size="13" font-weight="700" fill="#1a1a1a" dominant-baseline="central">Credential</text>
    <rect x="144" y="194" width="5.37" height="22" fill="rgba(26,26,26,0.07)"/>
    <rect x="144" y="198" width="5.37" height="14" fill="#1a1a1a"/>
    <rect x="144.5" y="198.5" width="1.68" height="13" fill="#EDECE8" stroke="#1a1a1a" stroke-width="1"/>
    <text x="534" y="197.5" font-size="12" fill="#696969" dominant-baseline="central">shipped</text>
    <text x="628" y="197.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">7</text>
    <text x="534" y="212.5" font-size="12" fill="#696969" dominant-baseline="central">hardened</text>
    <text x="628" y="212.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">14</text>

    <line x1="14" y1="228.5" x2="626" y2="228.5" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>

    <!-- Total: total 991, shipped 232, hardened 988 -->
    <text x="14" y="253" font-size="13" font-weight="700" fill="#1a1a1a" dominant-baseline="central">Total</text>
    <rect x="144" y="242" width="380" height="22" fill="rgba(26,26,26,0.07)"/>
    <rect x="144" y="246" width="378.85" height="14" fill="#1a1a1a"/>
    <rect x="144.5" y="246.5" width="87.96" height="13" fill="#EDECE8" stroke="#1a1a1a" stroke-width="1"/>
    <text x="534" y="245.5" font-size="12" fill="#696969" dominant-baseline="central">shipped</text>
    <text x="628" y="245.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">232</text>
    <text x="534" y="260.5" font-size="12" fill="#696969" dominant-baseline="central">hardened</text>
    <text x="628" y="260.5" font-size="12" fill="#1a1a1a" text-anchor="end" dominant-baseline="central">988</text>

    <!-- legend -->
    <rect x="14" y="296" width="16" height="12" fill="rgba(26,26,26,0.07)"/>
    <text x="36" y="302.0" font-size="12" fill="#696969" dominant-baseline="central">attacks</text>
    <rect x="106.5" y="296.5" width="15" height="11" fill="#EDECE8" stroke="#1a1a1a" stroke-width="1"/>
    <text x="128" y="302.0" font-size="12" fill="#696969" dominant-baseline="central">blocked by shipped code</text>
    <rect x="314" y="296" width="16" height="12" fill="#1a1a1a"/>
    <text x="336" y="302.0" font-size="12" fill="#696969" dominant-baseline="central">blocked with hardening</text>
  </g>
</svg>

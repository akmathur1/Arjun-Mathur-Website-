<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288"
     role="img" aria-label="The model boundary as a seven-stage pipeline: an untrusted record (CRM note, calendar body, email, page) is sanitized, scanned for control language with offending lines dropped, its source label constrained, then prompted to the model; the model's output is grounded against approved record tokens before it is shown as fact. Document text is data, never instructions.">
  <rect width="640" height="288" fill="#EDECE8"/>
  <g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">

    <!-- ROW 1 : stages 1-3 -->

    <!-- 1 Untrusted record (attacker's input, light fill) -->
    <rect x="12" y="16" width="160" height="80" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="92" y="36" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Untrusted record</text>
    <g font-size="12" fill="#696969" text-anchor="middle">
      <text x="92" y="55">CRM note</text>
      <text x="92" y="70">calendar body</text>
      <text x="92" y="85">email · page</text>
    </g>

    <path d="M 172 56 L 188 56" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 183 51 L 188 56 L 183 61" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2 Sanitize -->
    <rect x="188" y="16" width="176" height="80" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="276" y="36" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Sanitize</text>
    <g font-size="12" fill="#696969" text-anchor="middle">
      <text x="276" y="55">whitespace collapsed</text>
      <text x="276" y="70">fixed character budget</text>
    </g>

    <path d="M 364 56 L 380 56" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 375 51 L 380 56 L 375 61" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3 Detect control language -->
    <rect x="380" y="16" width="216" height="80" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="488" y="36" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Detect control language</text>
    <g font-size="12" fill="#696969" text-anchor="middle">
      <text x="488" y="55">role redefinition</text>
      <text x="488" y="70">override · exfiltration</text>
      <text x="488" y="85">forged turns → line dropped</text>
    </g>
    <!-- note under stage 3 -->
    <g font-size="11" fill="#696969" text-anchor="middle">
      <text x="488" y="112">shipped: matches literally</text>
      <text x="488" y="126">hardened: normalizes first</text>
    </g>

    <!-- return from end of row 1 to start of row 2 -->
    <path d="M 596 56 L 612 56 L 612 142 L 103 142 L 103 160" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 98 155 L 103 160 L 108 155" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ROW 2 : stages 4-7 -->

    <!-- 4 Constrain source label -->
    <rect x="12" y="160" width="182" height="80" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="103" y="180" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Constrain source label</text>
    <g font-size="12" fill="#696969" text-anchor="middle">
      <text x="103" y="199">short machine id, else</text>
      <text x="103" y="214">a fixed neutral label</text>
    </g>

    <path d="M 194 200 L 206 200" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 201 195 L 206 200 L 201 205" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 5 Prompt → model (solid ink) -->
    <rect x="206" y="183" width="118" height="34" fill="#1a1a1a"/>
    <text x="265" y="200" font-size="13" font-weight="700" fill="#EDECE8" text-anchor="middle" dominant-baseline="central">Prompt → model</text>

    <path d="M 324 200 L 336 200" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 331 195 L 336 200 L 331 205" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 6 Ground on output -->
    <rect x="336" y="160" width="170" height="80" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="421" y="180" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ground on output</text>
    <g font-size="12" fill="#696969" text-anchor="middle">
      <text x="421" y="199">every name, number,</text>
      <text x="421" y="214">date checked against</text>
      <text x="421" y="229">approved record tokens</text>
    </g>

    <path d="M 506 200 L 518 200" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 513 195 L 518 200 L 513 205" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 7 Shown as fact (light fill) -->
    <rect x="518" y="183" width="110" height="34" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="573" y="200" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Shown as fact</text>

    <!-- caption -->
    <text x="12" y="268" font-size="11" fill="#696969">Document text is data, never instructions.</text>
  </g>
</svg>

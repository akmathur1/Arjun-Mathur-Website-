<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" width="640" height="346" role="img" aria-label="A decision tree comparing two exits on one watch bought for 40,000 dollars: a committed dealer exit returning plus 1,900, versus waiting for a collector, which pays plus 3,700 with probability 0.70 and loses 2,300 with probability 0.30, for the same expected profit of plus 1,900">
<rect width="640" height="346" fill="#EDECE8"/>
<g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">
<text x="20" y="22" font-size="13" font-weight="700" fill="#1a1a1a">two exits, the same expected profit</text>

<!-- root -->
<rect x="20" y="101" width="106" height="34" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="73" y="123" font-size="13" fill="#1a1a1a" text-anchor="middle">cost $40,000</text>
<text x="20" y="151" font-size="11" fill="#696969">before</text>
<text x="20" y="167" font-size="11" fill="#696969">holding costs</text>

<!-- trunk -->
<path d="M 126 118 L 146 118" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- upper branch: committed dealer exit -->
<path d="M 146 118 L 146 63 L 420 63" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M 415 58 L 420 63 L 415 68" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="154" y="55" font-size="12" fill="#1a1a1a">committed dealer exit</text>
<rect x="422" y="46" width="76" height="34" fill="#1a1a1a"/>
<text x="460" y="68" font-size="14" font-weight="700" fill="#EDECE8" text-anchor="middle">+$1,900</text>
<text x="498" y="96" font-size="11" fill="#696969" text-anchor="end">net $42,000 · $100 holding</text>

<!-- lower branch: wait for a collector -->
<path d="M 146 118 L 146 174 L 308 174" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/>
<text x="154" y="166" font-size="12" fill="#1a1a1a">wait for a collector</text>
<path d="M 308 130 L 308 218" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- sale succeeds -->
<path d="M 308 130 L 420 130" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 415 125 L 420 130 L 415 135" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="318" y="122" font-size="12" fill="#1a1a1a">sale succeeds</text>
<text x="318" y="146" font-size="12" fill="#1a1a1a">p = 0.70</text>
<rect x="422" y="113" width="76" height="34" fill="rgba(26,26,26,0.16)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="460" y="135" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">+$3,700</text>
<text x="498" y="163" font-size="11" fill="#696969" text-anchor="end">net $44,500 · $800 holding</text>

<!-- sale fails -->
<path d="M 308 218 L 420 218" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 415 213 L 420 218 L 415 223" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="318" y="210" font-size="12" fill="#1a1a1a">sale fails</text>
<text x="318" y="234" font-size="12" fill="#1a1a1a">0.30</text>
<rect x="422" y="201" width="76" height="34" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="460" y="223" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">-$2,300</text>
<text x="498" y="251" font-size="11" fill="#696969" text-anchor="end">liquidate $38,500 · $800</text>

<!-- bracket joining the lower pair -->
<path d="M 504 130 L 512 130 L 512 218 L 504 218" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M 512 174 L 520 174" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 515 169 L 520 174 L 515 179" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="528" y="150" font-size="13" font-weight="700" fill="#1a1a1a">expected</text>
<text x="528" y="167" font-size="13" font-weight="700" fill="#1a1a1a">+$1,900</text>
<text x="528" y="187" font-size="11" fill="#696969">0.70(3,700) +</text>
<text x="528" y="203" font-size="11" fill="#696969">0.30(-2,300)</text>

<!-- bottom note -->
<rect x="20" y="266" width="600" height="48" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="36" y="287" font-size="12" fill="#1a1a1a">waiting beats the dealer only if p &gt; 0.70 — and pays for it</text>
<text x="36" y="305" font-size="12" fill="#1a1a1a">with a possible loss and a longer capital commitment</text>
<text x="20" y="332" font-size="11" fill="#696969">illustrative figures, not quotes for any particular watch</text>
</g></svg>

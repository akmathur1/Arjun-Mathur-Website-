<text x="390" y="74" font-size="15" fill="#1a1a1a" text-anchor="middle">v<tspan font-size="11" fill="#696969">(d,r)</tspan></text>
<text x="440.5" y="74" font-size="15" fill="#1a1a1a" text-anchor="middle">+</text>

<rect x="458" y="52" width="66" height="34" fill="rgba(26,26,26,0.07)"/>

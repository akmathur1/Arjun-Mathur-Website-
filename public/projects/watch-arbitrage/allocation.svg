<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="A bipartite allocation graph: four watches on the left, three buyers with capacity tags on the right, seven candidate routes of which four are selected, with the funding, capacity and shared cost constraints stated below">
<rect width="640" height="330" fill="#EDECE8"/>
<g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">
<text x="20" y="22" font-size="13" font-weight="700" fill="#1a1a1a">routes, not watches: allocation under funding and buyer capacity</text>

<!-- unselected candidate edges: hairline, lighter -->
<path d="M 116 70 L 250 112" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<path d="M 116 132 L 250 80" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<path d="M 116 148 L 250 166" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>

<!-- selected routes: ink 1.5 -->
<path d="M 116 58 L 250 58" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 245 53 L 250 58 L 245 63" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 116 102 L 250 74" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 245 69 L 250 74 L 245 79" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 116 140 L 250 126" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 245 121 L 250 126 L 245 131" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 116 178 L 250 178" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 245 173 L 250 178 L 245 183" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- left column: watches -->
<rect x="20" y="50" width="96" height="28" fill="#EDECE8" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="68" y="68" font-size="12" fill="#1a1a1a" text-anchor="middle">watch 1</text>
<rect x="20" y="88" width="96" height="28" fill="#EDECE8" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="68" y="106" font-size="12" fill="#1a1a1a" text-anchor="middle">watch 2</text>
<rect x="20" y="126" width="96" height="28" fill="#EDECE8" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="68" y="144" font-size="12" fill="#1a1a1a" text-anchor="middle">watch 3</text>
<rect x="20" y="164" width="96" height="28" fill="#EDECE8" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="68" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">watch 4</text>

<!-- right column: buyers -->
<rect x="250" y="54" width="96" height="28" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="298" y="72" font-size="12" fill="#1a1a1a" text-anchor="middle">buyer A</text>
<text x="298" y="96" font-size="11" fill="#696969" text-anchor="middle">capacity 2</text>
<rect x="250" y="107" width="96" height="28" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="298" y="125" font-size="12" fill="#1a1a1a" text-anchor="middle">buyer B</text>
<text x="298" y="149" font-size="11" fill="#696969" text-anchor="middle">capacity 1</text>
<rect x="250" y="160" width="96" height="28" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="298" y="178" font-size="12" fill="#1a1a1a" text-anchor="middle">buyer C</text>
<text x="298" y="202" font-size="11" fill="#696969" text-anchor="middle">capacity 2</text>

<!-- constraints, clear of the edges -->
<text x="392" y="116" font-size="11" fill="#696969">at most one buyer per watch</text>
<text x="392" y="134" font-size="11" fill="#696969">at most q(d) watches per buyer</text>

<rect x="20" y="222" width="600" height="54" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
<text x="34" y="244" font-size="12" fill="#1a1a1a">funding must hold on every day, not on average</text>
<text x="34" y="264" font-size="12" fill="#1a1a1a">shared travel and shipping are charged once to the route, not to each trade</text>

<text x="20" y="298" font-size="11" fill="#696969">scenarios keep the shared exposure: one buyer, one refund route,</text>
<text x="20" y="316" font-size="11" fill="#696969">one segment repricing can move several trades together</text>
</g></svg>

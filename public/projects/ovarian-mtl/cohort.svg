<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350"
     role="img" aria-label="The prediction problem drawn as a matrix. Rows are 89 patient-derived xenograft models, each carrying one RNA-seq expression profile of about 20,000 genes. Columns are the five second-line agents: topotecan, gemcitabine, doxorubicin, carboplatin and paclitaxel. Every model-agent cell holds two binary labels drawn as a pair of squares, the left one response and the right one progression, filled for yes and hollow for no. Filled squares are sparse and the two squares in a cell tend to agree, which is the severe class imbalance and the positive correlation between the labels. Eighty-nine models times five agents times two labels is 890 supervision signals against roughly 20,000 features.">
  <rect width="640" height="350" fill="#EDECE8"/>
  <g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#1a1a1a">89 PDX models</text>
    <text x="20" y="48" font-size="12" fill="#696969">one RNA-seq profile each</text>
    <text x="20" y="64" font-size="12" fill="#696969">~20,000 genes wide</text>
    <text x="386" y="64" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">5 second-line agents</text>
    <g font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">
      <text x="218" y="90">Topotecan</text>
      <text x="302" y="90">Gemcitabine</text>
      <text x="386" y="90">Doxorubicin</text>
      <text x="470" y="90">Carboplatin</text>
      <text x="554" y="90">Paclitaxel</text>
    </g>
    <!-- each row: one model. left, its expression profile; right, its ten labels -->
    <rect x="20" y="112" width="118" height="9" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.20)" stroke-width="1"/>
    <rect x="20" y="129" width="118" height="9" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.20)" stroke-width="1"/>

      <text x="470" y="186">⋮</text>
      <text x="554" y="186">⋮</text>
    </g>
    <g font-size="12">
      <text x="20" y="282" fill="#696969">one cell</text>
      <rect x="86" y="273" width="9" height="9" fill="#1a1a1a"/><rect x="100" y="273" width="9" height="9" fill="#EDECE8" stroke="rgba(26,26,26,0.20)" stroke-width="1"/>
      <text x="123" y="282" fill="#1a1a1a">left: response, right: progression &#183; filled = yes</text>
    </g>
    <text x="20" y="301" font-size="12" fill="#1a1a1a">89 models × 5 agents × 2 labels = <tspan font-weight="700">890 supervision signals</tspan></text>
    <g font-size="11" fill="#696969">
      <text x="20" y="321">cell values are illustrative; the real labels are severely imbalanced and</text>
      <text x="20" y="336">positively correlated &#8212; which is what the multitask model is built to exploit.</text>
    </g>
  </g>
</svg>

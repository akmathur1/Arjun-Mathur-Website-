<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"
     role="img" aria-label="SHAP attribution for one prediction drawn as a waterfall: from a base-rate tick on the left, seven gene contributions (gene a through gene g) stack left to right, each bar starting where the previous one ended; solid bars push the running value up toward response and hollow bars push it down, and the running value ends at a P(response) tick on the right. A hairline marks the base rate across the width. The bars are illustrative, not measured.">
  <rect width="640" height="300" fill="#EDECE8"/>
  <g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">

    <!-- base rate rule, y = 156 -->
    <path d="M 28 156 L 612 156" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>

    <!-- base tick -->
    <path d="M 62 142 L 62 170" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- connectors: each bar starts where the previous ended -->
    <g fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1">
      <path d="M 62 156 L 108 156"/>
      <path d="M 152 94 L 168 94"/>
      <path d="M 212 122 L 228 122"/>
      <path d="M 272 70 L 288 70"/>
      <path d="M 332 108 L 348 108"/>
      <path d="M 392 63 L 408 63"/>
      <path d="M 452 84 L 468 84"/>
      <path d="M 512 50 L 572 50"/>
    </g>

    <!-- bars: 44 wide, pitch 60; solid = up, hollow = down -->

    <!-- gene a : up 62  (156 -> 94) -->
    <rect x="108" y="94" width="44" height="62" fill="#1a1a1a"/>
    <path d="M 130 92 L 130 82" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 125 87 L 130 82 L 135 87" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gene b : down 28  (94 -> 122) -->
    <rect x="168" y="94" width="44" height="28" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <path d="M 190 124 L 190 134" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 185 129 L 190 134 L 195 129" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gene c : up 52  (122 -> 70) -->
    <rect x="228" y="70" width="44" height="52" fill="#1a1a1a"/>
    <path d="M 250 68 L 250 58" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 245 63 L 250 58 L 255 63" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gene d : down 38  (70 -> 108) -->
    <rect x="288" y="70" width="44" height="38" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <path d="M 310 110 L 310 120" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 305 115 L 310 120 L 315 115" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gene e : up 45  (108 -> 63) -->
    <rect x="348" y="63" width="44" height="45" fill="#1a1a1a"/>
    <path d="M 370 61 L 370 51" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 365 56 L 370 51 L 375 56" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gene f : down 21  (63 -> 84) -->
    <rect x="408" y="63" width="44" height="21" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <path d="M 430 86 L 430 96" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 425 91 L 430 96 L 435 91" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gene g : up 34  (84 -> 50) -->
    <rect x="468" y="50" width="44" height="34" fill="#1a1a1a"/>
    <path d="M 490 48 L 490 38" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 485 43 L 490 38 L 495 43" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- final tick at the prediction, y = 50 -->
    <path d="M 572 36 L 572 64" fill="none" stroke="#1a1a1a" stroke-width="3"/>

    <!-- label row -->
    <text x="62" y="194" font-size="12" fill="#696969" text-anchor="middle">base rate</text>
    <g font-size="12" fill="#1a1a1a">
      <text x="108" y="194">gene a</text>
      <text x="168" y="194">gene b</text>
      <text x="228" y="194">gene c</text>
      <text x="288" y="194">gene d</text>
      <text x="348" y="194">gene e</text>
      <text x="408" y="194">gene f</text>
      <text x="468" y="194">gene g</text>
    </g>
    <text x="572" y="194" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">P(response)</text>

    <!-- legend -->
    <rect x="28" y="214" width="12" height="12" fill="#1a1a1a"/>
    <text x="46" y="224" font-size="12" fill="#1a1a1a">pushes toward response</text>
    <rect x="232" y="214" width="12" height="12" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="250" y="224" font-size="12" fill="#1a1a1a">pushes away</text>

    <!-- caption -->
    <g font-size="11" fill="#696969">
      <text x="28" y="256">each gene's contribution sums to the prediction · aggregated over the cohort,</text>
      <text x="28" y="271">these surface the gene programs the model relies on</text>
    </g>
  </g>
</svg>

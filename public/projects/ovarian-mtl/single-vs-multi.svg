<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296"
     role="img" aria-label="Single-task versus multitask learning, side by side. Left: two completely separate networks, each input to trunk to head, one for response and one for progression, each seeing only its own labels. Right: one input feeds one shared trunk that splits into a response head and a progression head; dashed arrows carry the gradient from each head back into the shared trunk, so two supervision signals shape one representation. Caption: the labels are positively correlated, so each task's gradient is useful signal for the other, an inductive prior that matters most when single-task data is sparse.">
  <rect width="640" height="296" fill="#EDECE8"/>
  <g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">

    <!-- panel divider -->
    <path d="M 320 16 L 320 236" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>

    <!-- ================= LEFT PANEL : single-task ================= -->
    <text x="12" y="28" font-size="13" font-weight="700" fill="#1a1a1a">single-task</text>

    <!-- network 1 : response -->
    <rect x="12" y="46" width="48" height="30" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="36" y="61" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">input</text>
    <path d="M 60 61 L 72 61" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 67 56 L 72 61 L 67 66" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="46" width="48" height="30" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="96" y="61" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">trunk</text>
    <path d="M 120 61 L 132 61" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 127 56 L 132 61 L 127 66" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="132" y="46" width="48" height="30" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="156" y="61" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">head</text>
    <text x="188" y="61" font-size="12" font-weight="700" fill="#1a1a1a" dominant-baseline="central">response</text>
    <text x="12" y="94" font-size="11" fill="#696969">sees only its own labels</text>

    <!-- network 2 : progression -->
    <rect x="12" y="124" width="48" height="30" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="36" y="139" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">input</text>
    <path d="M 60 139 L 72 139" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 67 134 L 72 139 L 67 144" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="124" width="48" height="30" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="96" y="139" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">trunk</text>
    <path d="M 120 139 L 132 139" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 127 134 L 132 139 L 127 144" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="132" y="124" width="48" height="30" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="156" y="139" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">head</text>
    <text x="188" y="139" font-size="12" font-weight="700" fill="#1a1a1a" dominant-baseline="central">progression</text>
    <text x="12" y="172" font-size="11" fill="#696969">sees only its own labels</text>

    <!-- ================= RIGHT PANEL : multitask ================= -->
    <text x="332" y="28" font-size="13" font-weight="700" fill="#1a1a1a">multitask</text>

    <!-- input -->
    <rect x="332" y="85" width="48" height="30" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="356" y="100" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">input</text>
    <path d="M 380 100 L 392 100" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 387 95 L 392 100 L 387 105" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- shared trunk (spans both heads) -->
    <rect x="392" y="46" width="60" height="108" fill="rgba(26,26,26,0.07)" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="422" y="93" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">shared</text>
    <text x="422" y="107" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">trunk</text>

    <!-- head 1 : response -->
    <text x="628" y="38" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">response</text>
    <rect x="580" y="46" width="48" height="30" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="604" y="61" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">head</text>
    <!-- forward: trunk -> head -->
    <path d="M 452 52 L 580 52" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 575 47 L 580 52 L 575 57" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- gradient: head -> trunk (dashed, pointing left) -->
    <path d="M 580 70 L 452 70" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 457 65 L 452 70 L 457 75" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="458" y="90" font-size="11" fill="#696969">gradient from response</text>

    <!-- head 2 : progression -->
    <text x="458" y="114" font-size="11" fill="#696969">gradient from progression</text>
    <!-- gradient: head -> trunk (dashed, pointing left) -->
    <path d="M 580 130 L 452 130" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 457 125 L 452 130 L 457 135" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- forward: trunk -> head -->
    <path d="M 452 148 L 580 148" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 575 143 L 580 148 L 575 153" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="580" y="124" width="48" height="30" fill="none" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
    <text x="604" y="139" font-size="12" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">head</text>
    <text x="628" y="170" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">progression</text>

    <!-- takeaway under the right panel -->
    <text x="332" y="200" font-size="12" font-weight="700" fill="#1a1a1a">two supervision signals,</text>
    <text x="332" y="216" font-size="12" font-weight="700" fill="#1a1a1a">one representation</text>

    <!-- caption -->
    <text x="12" y="262" font-size="11" fill="#696969">the labels are positively correlated, so each task's gradient is useful signal for the other</text>
    <text x="12" y="278" font-size="11" fill="#696969">— an inductive prior that matters most when single-task data is sparse</text>
  </g>
</svg>

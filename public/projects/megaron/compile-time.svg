<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="A Rust command signature on the left — async fn say with message String bounded 1 to 280, volume with a default, times u32 bounded 1 to 10 — with an arrow labelled proc-macro, at build, fanning out to four results: a SystemDef with its definition hash, a JSON Schema per command, a dispatch arm that parses each key into the exact type, and a typed EchoClient::say. Below, five rust-outlined boxes name what rustc refuses: min on a bool, a regex that will not compile, a default of the wrong type, u64, and Vec of Option.">
<rect width="640" height="330" fill="#EDECE8"/>
<g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">
  <rect x="20" y="24" width="292" height="166" fill="rgba(26,26,26,0.07)" stroke="#1a1a1a" stroke-width="1.5"/>
  <g font-size="11" fill="#1a1a1a">
    <text x="32" y="44">#[command]</text>
    <text x="32" y="58">async fn say(</text>
    <text x="44" y="72">&amp;self, ctx: &amp;Ctx,</text>
    <text x="44" y="86" fill="#696969">#[param(min = 1, max = 280)]</text>
    <text x="44" y="100">message: String,</text>
    <text x="44" y="114" fill="#696969">#[param(default = Volume::Normal)]</text>
    <text x="44" y="128">volume: Volume,</text>
    <text x="44" y="142" fill="#696969">#[param(min = 1, max = 10, default = 1)]</text>
    <text x="44" y="156">times: u32,</text>
    <text x="32" y="170">) -&gt; Result&lt;Said, CommandError&gt;</text>
  </g>
  <!-- arrow and fan -->
  <path d="M 312 107 L 346 107" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 346 42 L 346 172" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 346 42 L 360 42"/><path d="M 355 37 L 360 42 L 355 47"/>
    <path d="M 346 86 L 360 86"/><path d="M 355 81 L 360 86 L 355 91"/>
    <path d="M 346 130 L 360 130"/><path d="M 355 125 L 360 130 L 355 135"/>
    <path d="M 346 172 L 360 172"/><path d="M 355 167 L 360 172 L 355 177"/>
  </g>
  <text x="340" y="206" font-size="11" fill="#696969" text-anchor="middle">the proc-macro, at build</text>
  <!-- outputs -->
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
    <rect x="360" y="24" width="260" height="36"/><rect x="360" y="68" width="260" height="36"/>
    <rect x="360" y="112" width="260" height="36"/><rect x="360" y="156" width="260" height="36"/>
  </g>
  <g font-size="11" fill="#1a1a1a">
    <text x="370" y="40">SystemDef · definition_hash</text>
    <text x="370" y="53" fill="#696969">sha256 over canonical JSON</text>
    <text x="370" y="84">JSON Schema 2020-12 · per command</text>
    <text x="370" y="97" fill="#696969">additionalProperties: false</text>
    <text x="370" y="128">dispatch · exact Rust type per key</text>
    <text x="370" y="141" fill="#696969">a mismatch is ParameterDrift: a bug</text>
    <text x="370" y="172">EchoClient::say(message, volume, n)</text>
    <text x="370" y="185" fill="#696969">a typed client for other Rust code</text>
  </g>
  <!-- refused -->
  <path d="M 20 222 L 620 222" stroke="rgba(26,26,26,0.18)" stroke-width="1"/>
  <text x="20" y="244" font-size="11" fill="#696969">refused by rustc, with the span of the attribute that caused it:</text>
  <g stroke="#b34f2a" stroke-width="1.5" fill="none">
    <rect x="30" y="260" width="104" height="30"/><rect x="142" y="260" width="140" height="30"/>
    <rect x="290" y="260" width="154" height="30"/><rect x="452" y="260" width="46" height="30"/>
    <rect x="506" y="260" width="104" height="30"/>
  </g>
  <g font-size="11" fill="#b34f2a" text-anchor="middle">
    <text x="82" y="279">min on a bool</text><text x="212" y="279">regex won't compile</text>
    <text x="367" y="279">default of wrong type</text><text x="475" y="279">u64</text>
    <text x="558" y="279">Vec&lt;Option&lt;T&gt;&gt;</text>
  </g>
  <text x="20" y="316" font-size="11" fill="#696969">what brewtils learns at plugin start, Megaron proves at build — or refuses to build.</text>
</g></svg>

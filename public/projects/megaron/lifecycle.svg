<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="The request state machine. Three boxes in a row — CREATED, RECEIVED, IN_PROGRESS — then a dashed group of four terminal states: SUCCESS, ERROR, CANCELED, INVALID. Blue arrows carry the path the plugin reports: created to received to in progress, then to success, error or canceled. Rust arcs carry what the hall decides: two above the row re-queue a request to CREATED when its plugin dies — always from RECEIVED, from IN_PROGRESS only if the command is idempotent with attempts remaining, otherwise it ends as ERROR Disconnected; two below take CREATED to CANCELED when cancelled before dispatch and to INVALID when the schema changed before dispatch.">
<rect width="640" height="360" fill="#EDECE8"/>
<g font-family="JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace">
  <!-- the row -->
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
    <rect x="20" y="140" width="104" height="32"/><rect x="170" y="140" width="104" height="32"/><rect x="320" y="140" width="104" height="32"/>
  </g>
  <g font-size="12" fill="#1a1a1a" text-anchor="middle">
    <text x="72" y="160">CREATED</text><text x="222" y="160">RECEIVED</text><text x="372" y="160">IN_PROGRESS</text>
  </g>
  <!-- terminal group -->
  <rect x="470" y="36" width="160" height="244" fill="none" stroke="rgba(26,26,26,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="550" y="28" font-size="11" fill="#696969" text-anchor="middle">terminal</text>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
    <rect x="482" y="48" width="136" height="24"/><rect x="482" y="104" width="136" height="24"/>
    <rect x="482" y="160" width="136" height="24"/><rect x="482" y="216" width="136" height="24"/>
  </g>
  <g font-size="12" fill="#1a1a1a" text-anchor="middle">
    <text x="550" y="64">SUCCESS</text><text x="550" y="120">ERROR</text><text x="550" y="176">CANCELED</text><text x="550" y="232">INVALID</text>
  </g>
  <g font-size="10" fill="#696969" text-anchor="middle">
    <text x="550" y="140">Failed · Panic</text>
    <text x="550" y="152">Disconnected · Drift</text>
    <text x="550" y="196">incl. CancelTimeout</text>
    <text x="550" y="252">InvalidParameters</text>
    <text x="550" y="264">ParameterDrift</text>
  </g>
  <!-- blue: what the plugin reported -->
  <g stroke="#2266a4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 124 156 L 170 156"/><path d="M 165 151 L 170 156 L 165 161"/>
    <path d="M 274 156 L 320 156"/><path d="M 315 151 L 320 156 L 315 161"/>
    <path d="M 424 150 C 450 150, 456 60, 482 60"/><path d="M 477 55 L 482 60 L 477 65"/>
    <path d="M 424 156 C 450 156, 456 116, 482 116"/><path d="M 477 111 L 482 116 L 477 121"/>
    <path d="M 424 162 C 450 162, 456 172, 482 172"/><path d="M 477 167 L 482 172 L 477 177"/>
  </g>
  <!-- rust: what the hall decided -->
  <g stroke="#b34f2a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 222 140 C 222 108, 80 108, 80 140"/><path d="M 75 135 L 80 140 L 85 135"/>
    <path d="M 372 140 C 372 50, 64 50, 64 140"/><path d="M 59 135 L 64 140 L 69 135"/>
    <path d="M 88 172 C 88 270, 420 270, 482 178"/><path d="M 479.4 184.6 L 482 178 L 475.4 180.6"/>
    <path d="M 72 172 C 72 312, 430 312, 482 234"/><path d="M 479.6 240.8 L 482 234 L 475.4 236.6"/>
  </g>
  <g font-size="11" fill="#b34f2a" text-anchor="middle">
    <text x="151" y="98">plugin died — always</text>
    <text x="218" y="62">plugin died — idempotent, attempts &lt; max_attempts</text>
    <text x="280" y="262">cancelled before dispatch</text>
    <text x="280" y="304">schema changed before dispatch</text>
  </g>
  <text x="460" y="190" font-size="10" fill="#b34f2a" text-anchor="end">died, not idempotent → ERROR · Disconnected</text>
  <!-- legend -->
  <path d="M 20 332 L 48 332" stroke="#2266a4" stroke-width="1.5"/>
  <text x="56" y="336" font-size="11" fill="#696969">the plugin reported it</text>
  <path d="M 230 332 L 258 332" stroke="#b34f2a" stroke-width="1.5"/>
  <text x="266" y="336" font-size="11" fill="#696969">the hall decided it — death, cancel grace, drift</text>
  <text x="20" y="354" font-size="11" fill="#696969">One table checks every transition; a late result is recorded as an event, never applied.</text>
</g></svg>

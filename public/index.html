<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arjun Mathur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; background: #EDECE8; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #1a1a1a;
      }
      /* Hairline between the activity graph and the investments panel. Lives here
         rather than inline so it can drop out once the two panels stack. */
      .panel-divider {
        align-self: stretch;
        width: 1px;
        background: rgba(26, 26, 26, 0.18);
      }
      /* Biased just above the point where the panels stack (~500px): the rule costs
         1px of row width, so hiding it a little early guarantees it can never be the
         thing that forces the wrap. */
      @media (max-width: 510px) {
        .panel-divider { display: none; }
      }
      /* Work chart: a left gutter with the organization's logo and name, and the
         time track. Narrow screens drop the name and let the logo carry the row. */
      .work-chart { --work-gutter: 176px; }
      .work-row {
        display: grid;
        grid-template-columns: var(--work-gutter) minmax(0, 1fr);
        align-items: center;
      }
      @media (max-width: 600px) {
        .work-chart { --work-gutter: 40px; }
        .work-chart .work-name { display: none; }
      }
      /* Bars draw in from the left on first paint, one row after another (the
         per-row delay is set inline). */
      .work-track { animation: work-reveal 700ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes work-reveal {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .work-track { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
